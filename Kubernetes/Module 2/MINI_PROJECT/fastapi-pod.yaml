apiVersion: v1
kind: Pod

metadata:
  name: fastapi-pod
  labels:
    app: fastapi

spec:
  containers:
    - name: fastapi

      image: fastapi-demo:v1

      imagePullPolicy: IfNotPresent

      ports:
        - containerPort: 8000

      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"

        limits:
          cpu: "500m"
          memory: "512Mi"

      livenessProbe:
        httpGet:
          path: /
          port: 8000

        initialDelaySeconds: 15
        periodSeconds: 10

      readinessProbe:
        httpGet:
          path: /
          port: 8000

        initialDelaySeconds: 5
        periodSeconds: 5